services:
  db:
    env_file:
      - ./env/dev/db.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql

  signal-ml:
    build:
      network: host
      target: development
      args:
        PIP_PROXY: ${PIP_PROXY:-http://127.0.0.1:10808}
    env_file:
      - ./env/dev/ml.env
    command: ["uvicorn", "service.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ../src/signal-ml/service:/app/service
      - ../src/signal-ml/src:/app/src
      - ../data:/app/data
      - ../artifacts:/app/artifacts

  api:
    build:
      network: host
      target: development
    env_file:
      - ./env/dev/api.env
      - ./env/dev/db.env
    command: ["dotnet", "watch", "run", "--no-launch-profile", "--urls", "http://0.0.0.0:8080"]
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ../src/backend:/workspace
      - dotnet_nuget:/home/app/.nuget/packages

  dashboard:
    build:
      network: host
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../src/frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]

volumes:
  postgres_dev_data:
    name: crypto-signal-postgres-dev-dotnet
  dotnet_nuget:
  frontend_node_modules:
