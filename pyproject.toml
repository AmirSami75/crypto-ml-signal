[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-ml-signal"
version = "0.2.0"
description = "Leakage-aware cryptocurrency ML signals and cost-aware backtesting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Crypto ML Signal Project"}]
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
service = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]
dev = []

[project.scripts]
crypto-signal = "crypto_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
